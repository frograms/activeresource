name: CI

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    # test/dummy 가 trilogy 로 127.0.0.1:3306 의 activeresource_test 에 붙는다 (schema 는 utf8mb4_0900_ai_ci 라 MySQL 8)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: activeresource_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      # 운영에서 이 gem 을 싣는 ale 와 같은 버전으로 테스트한다
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake test
